<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Predicción de retraso de vuelo</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>¿Cuánto se retrasará mi vuelo?</h1>
    <p class="subtitle">Escribe el número de vuelo (ej. KL1508, BA5817) y buscamos el avión concreto que lo va a operar y su vuelo de llegada anterior.</p>

    <form id="search-form">
      <input id="flight-input" type="text" placeholder="Número de vuelo" autocomplete="off" required />
      <button type="submit">Consultar</button>
    </form>

    <div id="result" class="result hidden"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
