<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>You're Late Again</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <div class="brand">
      <span class="brand-emoji">🛫</span>
      <p class="brand-name">You're Late Again</p>
    </div>

    <main class="card">
      <h1>How late will your flight be?</h1>
      <p class="subtitle">Enter a flight number (e.g. KL1508, BA5817) and we'll find the exact aircraft operating it and its previous inbound flight.</p>

      <form id="search-form">
        <input id="flight-input" type="text" placeholder="Flight number" autocomplete="off" required />
        <button type="submit">Check</button>
      </form>

      <div id="result" class="result hidden"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
